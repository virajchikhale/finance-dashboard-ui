# docker compose up -d --build   ->   http://localhost:8080
# (a static site; the data comes from your own Google Apps Script URL, entered in the UI)
services:
  web:
    build: .
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers (see security-headers.inc; the app only talks to Google's Apps Script endpoint)
  include /etc/nginx/conf.d/security-headers.inc;

  # Hashed build assets can be cached for a long time; index.html must always be revalidated
  location /static/ { include /etc/nginx/conf.d/security-headers.inc; expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location = /index.html { include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
